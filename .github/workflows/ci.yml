name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/'
      - 'appcast.xml'
  push:
    branches: [dev, v3, v4]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/'
      - 'appcast.xml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  # The reusable release workflow declares a write-scoped publish job.
  # Its publish condition excludes pull_request and non-release branches.
  contents: write

jobs:
  run:
    uses: ./.github/workflows/panel-kernel-release.yml
