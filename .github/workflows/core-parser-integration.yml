name: Core and parser integration regressions
on:
  push:
    branches:
      - main
      - sync/upstream-v5.5.5-20261105
    paths:
      - go.mod
      - go.sum
      - hiddify-sing-box
      - ray2sing
      - v2/**
      - platform/mobile/**
      - .gitmodules
      - .github/workflows/core-parser-integration.yml
  pull_request:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - hiddify-sing-box
      - ray2sing
      - v2/**
      - platform/mobile/**
      - .gitmodules
      - .github/workflows/core-parser-integration.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify exact nested fork revisions
        shell: bash
        run: |
          set -euo pipefail
          git submodule status --recursive
          test "$(git -C hiddify-sing-box rev-parse HEAD)" = 1805e724b1e83ff748077783a5558d74a3049b39
          git -C ray2sing status --porcelain
          test "$(git -C ray2sing rev-parse HEAD)" = c6368fc6adea94f7aa9ec57065aae3ad53343ac4
          test "$(go list -mod=readonly -m -f '{{if .Replace}}{{.Replace.Dir}}{{end}}' github.com/sagernet/sing)" = "$PWD/hiddify-sing-box/replace/sing"
      - name: Download and compile all native packages
        shell: bash
        run: |
          set -euo pipefail
          go mod download all
          tags=$(make -s print-NATIVE_TEST_TAGS)
          go test -mod=readonly -run '^$' -ldflags=-checklinkname=0 -tags "$tags" ./v2/... ./platform/mobile
      - name: Native APIs and parser regression tests
        shell: bash
        run: |
          set -euo pipefail
          tags=$(make -s print-NATIVE_TEST_TAGS)
          go test -mod=readonly -ldflags=-checklinkname=0 -tags "$tags" ./v2/config/... ./platform/mobile
          # Test the owned parser using the parent core module graph. Running
          # inside ray2sing/ resolves its separate, older sing-box replaces and
          # misses the pinned native VMess/Vision and reverse implementations.
          go test -mod=readonly -ldflags=-checklinkname=0 \
            github.com/hiddify/ray2sing/ray2sing/... \
            github.com/hiddify/ray2sing/ray2sing_test/...
      - name: Native overlay behavior regressions (including reverse, Vision, REALITY and XHTTP)
        shell: bash
        run: |
          set -euo pipefail
          tags=$(make -s print-NATIVE_TEST_TAGS)
          # Match ALL native TestXUI cases, not only TestXUIPanel: the previous
          # expression silently excluded VLESS reverse and XHTTP upload queue.
          # Run vendored sing-vmess through the parent module's pinned graph.
          go test -mod=readonly -ldflags=-checklinkname=0 -tags "$tags" \
            github.com/sagernet/sing-box/common/tls \
            github.com/sagernet/sing-box/protocol/vless \
            github.com/sagernet/sing-box/protocol/group \
            github.com/sagernet/sing-box/transport/v2rayxhttp \
            github.com/sagernet/sing-box/transport/v2raykcp \
            github.com/sagernet/sing-vmess/vless \
            -run '^(TestXUI|TestH_KCP|TestH_Vision)' -count=1 -timeout=15m
      - name: Native Xray balancer and mKCP compatibility
        shell: bash
        run: |
          set -euo pipefail
          tags=$(make -s print-NATIVE_TEST_TAGS)
          # Upstream router tests need a geosite.dat fixture unavailable in the
          # vendored runtime module. Test our actual observer integration and
          # mKCP, then compile the pinned router without unrelated geodata tests.
          go test -mod=readonly -ldflags=-checklinkname=0 -tags "$tags" \
            github.com/sagernet/sing-box/common/xray \
            github.com/sagernet/sing-box/option \
            -run '^(TestH_NativeXrayRuntime|TestXUI)' -count=1 -timeout=5m
          go test -mod=readonly -ldflags=-checklinkname=0 -tags "$tags" \
            github.com/xtls/xray-core/app/router -run '^$'
          go test -mod=readonly -ldflags=-checklinkname=0 -tags "$tags" \
            github.com/xtls/xray-core/transport/internet/kcp \
            -run '^Test' -count=1 -timeout=15m
      - name: Native vet
        shell: bash
        run: |
          set -euo pipefail
          tags=$(make -s print-NATIVE_TEST_TAGS)
          go vet -mod=readonly -tags "$tags" ./v2/...

          go test -mod=readonly -ldflags=-checklinkname=0 -tags "$tags" \
            github.com/xtls/xray-core/transport/internet/kcp \
            -run '^Test' -count=1 -timeout=15m
      - name: Native vet
        shell: bash
        run: |
          set -euo pipefail
          tags=$(make -s print-NATIVE_TEST_TAGS)
          go vet -mod=readonly -tags "$tags" ./v2/...
