name: Native client validation and lifecycle

on:
  pull_request:
    paths:
      - 'platform/mobile/**'
      - 'v2/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/native-client-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-client-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hiddify-sing-box/go.sum
      - name: Download exact selected module graph
        shell: bash
        run: |
          set -euo pipefail
          # Retry transient proxy/CDN errors, then fall back to the module's
          # original VCS. Go continues verifying modules against go.sum.
          for attempt in 1 2 3; do
            if GOPROXY='https://proxy.golang.org|direct' go mod download all; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              echo 'Pinned Go dependencies remain unavailable' >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
      - name: Vet native core APIs
        run: |
          tags=$(make -s print-NATIVE_TEST_TAGS)
          go vet -mod=readonly -tags "$tags" ./v2/...
      - name: Test native validation and lifecycle with race detection
        run: |
          tags=$(make -s print-NATIVE_TEST_TAGS)
          go test -mod=readonly -race -ldflags=-checklinkname=0 -tags "$tags" ./v2/... ./platform/mobile
