name: olcRTC compatibility checks

on:
  pull_request:
    branches: [main]
    paths:
      - "v2/config/paneluri/**"
      - "hiddify-sing-box"
      - ".github/workflows/olcrtc-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check olcRTC native outbound and dependencies
        working-directory: hiddify-sing-box
        run: |
          go mod tidy
          go test -ldflags=-checklinkname=0 ./protocol/olcrtc ./include
      - name: Test olcRTC share parsing
        run: |
          go mod tidy
          go test -ldflags=-checklinkname=0 ./v2/config/paneluri ./v2/config

  android-arm64:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '17'
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r30
      - name: Prepare and build olcRTC Android ARM64 AAR
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          go mod tidy
          make android-arm64
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: olcrtc-core-android-arm64-debug
          path: bin/hiddify-core.aar
          if-no-files-found: error
          retention-days: 7
