name: olcRTC compatibility checks

on:
  pull_request:
    branches: [main]
    paths:
      - "v2/config/paneluri/**"
      - "hiddify-sing-box"
      - ".github/workflows/olcrtc-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check olcRTC native outbound and dependencies
        working-directory: hiddify-sing-box
        run: |
          go mod tidy
          go test -ldflags=-checklinkname=0 ./protocol/olcrtc ./include
      - name: Test olcRTC share parsing
        run: |
          go mod tidy
          go test -ldflags=-checklinkname=0 ./v2/config/paneluri ./v2/config
