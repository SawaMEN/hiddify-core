name: Release modified Sing-box

on:
  push:
    branches: [update, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Run for every commit and serialize publication; no cancellations.
concurrency:
  group: kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Update dev builds follow the modified fork's main branch. Stable builds
  # retain their reviewed gitlink so releases remain reproducible.
  resolve_singbox:
    name: Resolve Sing-box revision
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check panel overlay preparation
        run: python3 -m unittest discover -s tools -p 'test_prepare_panel_kernel.py'
      - name: Resolve source revision
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/update" ]]; then
            commit=$(git ls-remote https://github.com/SawaMEN/hiddify-sing-box.git refs/heads/main | awk '$2 == "refs/heads/main" {print $1}')
          else
            commit=$(git ls-tree HEAD -- hiddify-sing-box | awk '$1 == "160000" && $2 == "commit" {print $3}')
          fi
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "Could not resolve Sing-box source revision" >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Selected Sing-box revision: $commit"

  build:
    needs: resolve_singbox
    name: Build modified kernel (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout triggering kernel commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout panel overlays
        uses: actions/checkout@v7
        with:
          repository: SawaMEN/3x-ui
          ref: main
          path: panel-source
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: panel-source/go.sum
      - name: Set exact source and release identity
        env:
          KERNEL_COMMIT: ${{ github.sha }}
          SINGBOX_COMMIT: ${{ needs.resolve_singbox.outputs.commit }}
          KERNEL_CHANNEL: ${{ github.ref == 'refs/heads/update' && 'dev' || 'stable' }}
        run: python3 tools/prepare-panel-kernel.py panel-source
      - name: Build and test kernel from the triggering commit
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          SINGBOX_CRONET_LINKAGE: purego
        run: bash panel-source/tools/build-hiddify-core.sh "$PWD/kernel-output"
      - name: Package verified kernel
        env:
          KERNEL_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir release-assets
          tar -C kernel-output -czf "release-assets/sing-box-linux-$KERNEL_ARCH.tar.gz" \
            "hiddify-core-linux-$KERNEL_ARCH" "hiddify-core-linux-$KERNEL_ARCH.sha256" \
            libcronet.so libcronet.so.sha256 target.json
          (cd release-assets && sha256sum "sing-box-linux-$KERNEL_ARCH.tar.gz" > "sing-box-linux-$KERNEL_ARCH.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: sing-box-linux-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0

  build-android:
    name: Android ARM64 AAR and root companion
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: SawaMEN/3x-ui
          ref: main
          path: panel-source
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$manager" ] || manager=$(command -v sdkmanager)
          "$manager" "ndk;30.0.16248370" "platforms;android-24"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Set matching stable version identity
        env:
          KERNEL_COMMIT: ${{ github.sha }}
          KERNEL_CHANNEL: stable
        run: python3 tools/prepare-panel-kernel.py panel-source
      - name: Build Android AAR and root executable
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("panel-source/docs/hiddify-core-target.json"))["target"]["version"])')
          sing=$(git rev-parse HEAD:hiddify-sing-box | cut -c 1-12)
          # Resolve transitive module sums for the selected Sing-box gitlink before gomobile.\n          go mod tidy\n          make android-arm64 CODE_VERSION="-X github.com/hiddify/hiddify-core/v2/hcommon/constants.Version=$version -X github.com/sagernet/sing-box/constant.Version=sawamen-$sing"
          go run ./cmd/internal/build_root
      - name: Package and validate mobile assets
        run: |
          set -euo pipefail
          mkdir -p release-android release-assets
          python3 - <<'PY'
          import json, pathlib, shutil, struct, zipfile
          folder = pathlib.Path("release-android")
          aar = pathlib.Path("bin/hiddify-core.aar")
          companion = pathlib.Path("bin/libhiddify-root.so")
          if not aar.is_file() or aar.stat().st_size < 100000:
              raise SystemExit("Android AAR missing or empty")
          with zipfile.ZipFile(aar) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Android AAR corrupted")
              if not any(x.startswith("jni/arm64-v8a/") and x.endswith(".so") for x in archive.namelist()):
                  raise SystemExit("No ARM64 native library in Android AAR")
          with companion.open("rb") as executable:
              header = executable.read(20)
          if len(header) != 20 or header[:6] != b"\x7fELF\x02\x01" or struct.unpack_from("<HH",header,16) != (3,183):
              raise SystemExit("Android root companion must be ARM64 ELF PIE")
          shutil.copyfile(aar, folder/"hiddify-core.aar")
          shutil.copyfile(companion, folder/"libhiddify-root.so")
          manifest = json.loads(pathlib.Path("panel-source/docs/hiddify-core-target.json").read_text())
          manifest["android_build"] = {"platform": "android", "arch": "arm64"}
          (folder/"target.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          (cd release-android && sha256sum hiddify-core.aar libhiddify-root.so > SHA256SUMS)
          tar -C release-android -czf release-assets/hiddify-core-android-arm64.tar.gz hiddify-core.aar libhiddify-root.so target.json SHA256SUMS
          (cd release-assets && sha256sum hiddify-core-android-arm64.tar.gz > hiddify-core-android-arm64.tar.gz.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: hiddify-core-android-arm64
          path: |
            release-assets/hiddify-core-android-arm64.tar.gz
            release-assets/hiddify-core-android-arm64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish dev or stable release
    needs: [build, build-android]
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/update' || github.ref == 'refs/heads/main') &&
      needs.build.result == 'success' &&
      (github.ref == 'refs/heads/update' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: sing-box-linux-*
          path: release-assets
          merge-multiple: true
      - name: Download Android stable assets
        if: github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v7
        with:
          name: hiddify-core-android-arm64
          path: release-assets
      - name: Publish matching channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KERNEL_COMMIT: ${{ github.sha }}
          KERNEL_CHANNEL: ${{ github.ref == 'refs/heads/update' && 'dev' || 'stable' }}
        run: |
          set -euo pipefail
          tag=$(tar -xOzf release-assets/sing-box-linux-amd64.tar.gz target.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["target"]["version"])')
          other=$(tar -xOzf release-assets/sing-box-linux-arm64.tar.gz target.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["target"]["version"])')
          [ "$tag" = "$other" ] || { echo "Architectures disagree" >&2; exit 1; }
          if [ "$KERNEL_CHANNEL" = stable ]; then
            (cd release-assets && sha256sum -c hiddify-core-android-arm64.tar.gz.sha256)
            android_tag=$(tar -xOzf release-assets/hiddify-core-android-arm64.tar.gz target.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["target"]["version"])')
            [ "$tag" = "$android_tag" ] || { echo "Android/Linux releases disagree" >&2; exit 1; }
          fi
          if [ "$KERNEL_CHANNEL" = dev ]; then
            [[ "$tag" == sawamen-dev-* ]] || exit 1
          else
            [[ "$tag" == sawamen-* && "$tag" != sawamen-dev-* ]] || exit 1
          fi
          cat > release-notes.md <<NOTES
          Modified Sing-box ($KERNEL_CHANNEL) for 3x-ui
          Kernel commit: $KERNEL_COMMIT
          Branch: $GITHUB_REF_NAME
          Verified Linux AMD64/ARM64 with libcronet.so, target.json, SHA-256.
          Stable releases also provide Android ARM64 AAR and root companion.
          NOTES
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            published=$(gh release view "$tag" --json isDraft --jq '.isDraft')
            [ "$published" = false ] || { echo "Draft already exists: $tag" >&2; exit 1; }
            available=$(gh release view "$tag" --json assets --jq '.assets[].name')
            required=(sing-box-linux-amd64.tar.gz sing-box-linux-amd64.tar.gz.sha256 sing-box-linux-arm64.tar.gz sing-box-linux-arm64.tar.gz.sha256)
            if [ "$KERNEL_CHANNEL" = stable ]; then
              required+=(hiddify-core-android-arm64.tar.gz hiddify-core-android-arm64.tar.gz.sha256)
            fi
            for name in "${required[@]}"; do
              grep -Fxq "$name" <<< "$available" || { echo "Existing release incomplete: $name" >&2; exit 1; }
            done
            echo "Already published: $tag"
            exit 0
          fi
          gh release create "$tag" --target "$KERNEL_COMMIT" --draft \
            --title "Modified Sing-box $tag" --notes-file release-notes.md
          gh release upload "$tag" release-assets/*.tar.gz release-assets/*.sha256
          if [ "$KERNEL_CHANNEL" = dev ]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          else
            gh release edit "$tag" --draft=false --prerelease=false --latest
          fi
          echo "Published $KERNEL_CHANNEL kernel: $tag"
