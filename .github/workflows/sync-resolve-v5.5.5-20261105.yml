name: Validate merged upstream v5.5.5 core

on:
  push:
    branches: [sync/upstream-v5.5.5-20261105]

permissions:
  contents: read

jobs:
  native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify pinned fork and complete dependency graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C hiddify-sing-box rev-parse HEAD)" = 0dcb695697518f7999359ebbdcd0c8daf4d13e67
          test "$(git -C ray2sing rev-parse HEAD)" = ed1a4b12297992de89adf2a7a91ce5ec397d4819
          go mod download all
          test "$(go list -mod=readonly -m -f '{{if .Replace}}{{.Replace.Dir}}{{end}}' github.com/sagernet/sing)" = "$PWD/hiddify-sing-box/replace/sing"
      - name: Native package tests with race detection
        shell: bash
        run: |
          set -euo pipefail
          tags=$(make -s print-NATIVE_TEST_TAGS)
          go test -mod=readonly -race -ldflags=-checklinkname=0 -tags "$tags" ./v2/config/... ./v2/hcore/... ./platform/mobile
      - name: Native core vet
        shell: bash
        run: |
          set -euo pipefail
          tags=$(make -s print-NATIVE_TEST_TAGS)
          go vet -mod=readonly -tags "$tags" ./v2/...
      - name: Parser standalone unit tests
        run: |
          cd ray2sing
          go test ./...
