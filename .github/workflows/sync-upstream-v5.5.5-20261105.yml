name: Port upstream v5.5.5 without replacing fork changes

on:
  push:
    branches:
      - sync/upstream-v5.5.5-20261105

permissions:
  contents: write

jobs:
  merge-upstream:
    if: github.repository == 'SawaMEN/hiddify-core'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - name: Fetch exact upstream release base and latest checked main
        run: |
          git remote add hiddify https://github.com/hiddify/hiddify-core.git
          git fetch --no-tags hiddify refs/tags/v5.5.0:refs/tags/_upstream_v5_5_0
          git fetch --no-tags hiddify refs/heads/main:refs/remotes/hiddify/main
          test "$(git rev-parse refs/tags/_upstream_v5_5_0)" = 2abb184510f62ce0fdc16712b9052bf1f18d272a
          test "$(git rev-parse refs/remotes/hiddify/main)" = f40d9b0e2933a30788d11b4f4d8b5a17288f539b
      - name: Three-way port only conflict-free source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile

          BASE = "refs/tags/_upstream_v5_5_0"
          NEW = "refs/remotes/hiddify/main"
          def git(*args, check=True):
              return subprocess.run(["git", *args], stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=check)
          def at(ref, path):
              r = git("show", f"{ref}:{path}", check=False)
              return None if r.returncode else r.stdout
          def tree(ref, path):
              s = git("ls-tree", ref, "--", path).stdout.decode().strip()
              if not s:
                  return None
              mode, kind, sha = s.split("\t")[0].split()
              return (mode, kind, sha)

          changed = git("diff", "--name-only", BASE, NEW).stdout.decode().splitlines()
          merged = []
          pending = []
          for path in changed:
              old_entry, new_entry = tree(BASE, path), tree(NEW, path)
              source = Path(path)
              if not new_entry:
                  pending.append((path, "upstream deleted file; requires review"))
                  continue
              if new_entry[0] == "160000":
                  if path == "hiddify-sing-box":
                      pending.append((path, "keep custom SawaMEN engine; update separately with its own dependency pins"))
                  elif old_entry and tree("HEAD", path) == old_entry:
                      git("update-index", "--add", "--cacheinfo", f"160000,{new_entry[2]},{path}")
                      merged.append(path + " (gitlink)")
                  else:
                      pending.append((path, "customized git submodule pointer"))
                  continue
              baseline = at(BASE, path) if old_entry else None
              theirs = at(NEW, path)
              if theirs is None:
                  pending.append((path, "unable to load upstream file"))
                  continue
              ours = source.read_bytes() if source.exists() and source.is_file() else None
              if ours == theirs:
                  merged.append(path + " (already current)")
                  continue
              if ours == baseline:
                  source.parent.mkdir(parents=True, exist_ok=True)
                  source.write_bytes(theirs)
                  git("add", "--", path)
                  merged.append(path)
              elif baseline is None or ours is None:
                  pending.append((path, "both sides independently added or deleted file"))
              else:
                  with tempfile.TemporaryDirectory() as d:
                      a, b, c = [Path(d) / name for name in ("ours", "base", "theirs")]
                      a.write_bytes(ours)
                      b.write_bytes(baseline)
                      c.write_bytes(theirs)
                      r = subprocess.run(["git", "merge-file", "-p", "--diff3", str(a), str(b), str(c)],
                                         stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                      if r.returncode == 0:
                          source.write_bytes(r.stdout)
                          git("add", "--", path)
                          merged.append(path + " (three-way)")
                      else:
                          pending.append((path, "overlapping source edits; manual three-way resolution needed"))

          report = Path("docs/integration/20261105-upstream-v5.5.5-status.md")
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text(
              "# Upstream hiddify-core synchronization status (2026-11-05)\n\n"
              "Upstream: `hiddify/hiddify-core` main `f40d9b0e2933a30788d11b4f4d8b5a17288f539b`.\n"
              "Base release: `v5.5.0` (`2abb184510f62ce0fdc16712b9052bf1f18d272a`).\n"
              "This branch retains the fork's independent changes and excludes conflicted files.\n\n"
              f"## Applied ({len(merged)})\n\n" + "".join(f"- `{p}`\n" for p in merged)
              + f"\n## Pending ({len(pending)})\n\n"
              + "".join(f"- `{p}`: {reason}\n" for p,reason in pending)
              + "\nDo not merge this branch before pending conflicts and native tests are resolved.\n",
              encoding="utf-8")
          git("add", "--", str(report))
          print(f"APPLIED {len(merged)} / CHANGED {len(changed)}")
          for p in merged: print("APPLIED", p)
          print(f"PENDING {len(pending)}")
          for p, reason in pending: print("PENDING", p, reason)
          PY
      - name: Commit reviewable merge candidates to sync branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): port conflict-free upstream v5.5.5 changes"
            git push origin HEAD:refs/heads/sync/upstream-v5.5.5-20261105
          fi
