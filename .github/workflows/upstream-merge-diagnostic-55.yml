name: Integrate upstream hiddify-core 5.5.0 with SawaMEN customizations

on:
  push:
    branches: [sync/upstream-v5.5.0]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-hiddify-55-integration
  cancel-in-progress: true

jobs:
  merge-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Merge fork's custom main branch into upstream 5.5.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          set +e
          git merge --no-commit --no-ff origin/main
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            python3 tools/integrate_upstream_55.py
          fi
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved merge conflict" >&2
            exit 1
          fi
          git status --short
      - name: Get compatible custom submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c submodule.fetchJobs=6 submodule update --init --recursive --depth=1 --jobs 6
      - name: Regenerate RPC bindings from merged protocol schemas
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          export PATH="$(go env GOPATH)/bin:$PATH"
          protoc -I . -I /usr/include --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative v2/hcore/hcore.proto v2/hcore/hcore_service.proto
      - name: Reconcile dependencies for core and custom transports
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          echo 'Normalized module graph:'
          grep -n 'masterdnsvpn-go' go.mod || true
          go list -m all >/dev/null
      - name: Compile native core, configuration and mobile adapters
        shell: bash
        run: |
          set -euo pipefail
          tags=$(make -s print-NATIVE_TEST_TAGS)
          go test -mod=readonly -run '^$' -ldflags=-checklinkname=0 -tags "$tags" ./v2/... ./platform/mobile
      - name: Commit validated merge candidate to source PR branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -f tools/integrate_upstream_55.py .github/workflows/upstream-merge-diagnostic-55.yml
          git add -A
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then exit 1; fi
          git diff --cached --check
          git commit -m "Merge Hiddify core 5.5.0 while preserving SawaMEN customizations"
          git push origin HEAD:refs/heads/sync/upstream-v5.5.0
