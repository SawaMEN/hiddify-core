name: Validate upstream hiddify-core merge

on:
  push:
    branches:
      - sync/hiddify-upstream-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Compile merged core, configuration and panel packages
        run: go test -mod=mod -run '^$' ./v2/config/... ./v2/hcore/...
